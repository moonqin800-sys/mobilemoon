hed #a6bdd3;background:#fff;color:#4d788c;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:12px}.upload-tile b{font-size:30px;line-height:1.1;color:#146abd}#orderDetail .card{padding:14px;margin:12px 0}#orderDetail .card>.field,#orderDetail .goods>.field{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:8px;margin-top:10px}#orderDetail .field input,#orderDetail .field select{margin-top:0;min-height:44px;padding:9px 10px;font-size:15px}#orderDetail .goods{padding:12px;margin-top:14px}#orderDetail .goods .heading{margin-bottom:0}#orderDetail .goods .heading button{padding:0;min-width:44px}#orderDetail .compact-specs{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}#orderDetail .compact-specs .field{margin:0;font-size:12px}#orderDetail .compact-specs input,#orderDetail .compact-specs select{margin-top:5px;padding:8px 6px}#orderDetail .compact-specs input::placeholder{font-size:12px}#orderDetail .error:empty{margin:0}</style><div class="phone"><header><b id="title">选择赠品</b><select id="ka" aria-label="当前 KA" hidden><option>爱婴室</option><option>孩子王</option><option>沃尔玛</option><option>爱婴岛</option><option>盒马</option><option>天虹</option></select></header><div id="backBar" class="back-bar hidden"><button id="backGift" class="secondary">‹ 返回选择赠品</button><button id="backList" class="secondary hidden">‹ 返回订单列表</button></div><main id="scroll"><section id="giftStep"><div class="brand-options"><label class="brand-option"><div class="can">Friso<br><small>皇家</small></div><b>港版皇家</b><input type="number" min="0" step="1" placeholder="请输入听数" aria-label="港版皇家听数"></label><label class="brand-option"><div class="can">Friso<br><small>有机</small></div><b>港版有机皇家</b><input type="number" min="0" step="1" placeholder="请输入听数" aria-label="港版有机皇家听数"></label><label class="brand-option"><div class="can">Friso<br><small>美素佳儿</small></div><b>荷兰版美素佳儿</b><input type="number" min="0" step="1" placeholder="请输入听数" aria-label="荷兰版美素佳儿听数"></label></div><div class="gift-options"><label class="gift-choice"><span class="tier">买<br>3<br>听送</span><div class="gift-content"><div class="gift-illustration">儿童三轮车</div><input type="checkbox" aria-label="选择3听赠品"><span class="muted">儿童三轮车</span></div></label><label class="gift-choice"><span class="tier">买<br>6<br>听送</span><div class="gift-content"><div class="gift-illustration">儿童平衡车</div><input type="checkbox" aria-label="选择6听赠品"><span class="muted">儿童平衡车</span></div></label><label class="gift-choice"><span class="tier">买<br>12<br>听送</span><div class="gift-content"><div class="gift-illustration">舒适睡枕</div><input type="checkbox" aria-label="选择12听赠品"><span class="muted">舒适睡枕</span></div></label></div><button id="nextStep" class="primary" style="margin-top:20px">下一步</button></section><section id="entry" class="hidden"><div class="card upload-sticky" style="margin-top:0"><div class="heading"><h2><span class="step">1</span> 上传订单截图</h2></div><input id="files" type="file" accept="image/*" hidden><div class="upload-tiles"><div id="loose" class="uploaded-tiles"></div><button class="upload upload-tile" id="upload"><b id="uploadLabel">＋</b><span>拍照 / 上传</span></button></div><div class="note" id="uploadHint">每次上传1张，最多3张（0/3）</div><button id="recognize" class="primary" style="margin-top:14px" disabled>上传并开始识别</button></div><div class="heading"><h2><span class="step">2</span> 订单列表</h2></div><div id="draftList"></div><div id="empty" class="empty">上传截图后，核对订单信息</div><div class="redeem-action"><div id="redeemError" class="error" role="alert" style="margin-bottom:10px;white-space:pre-line"></div><button id="generateRedeem" class="primary" disabled>生成核销码</button></div></section><section id="orderDetail" class="hidden"><div id="forms"></div></section><section id="query" class="hidden"><label class="field" style="margin-top:0">订单号<input id="search" type="search" placeholder="搜索订单号"></label><div class="note">近两个月 · 本人上传</div><div id="list"></div></section></main><footer id="orderFooter" class="foot hidden"><div class="nav"><button id="entryTab" class="active">订单录入</button><button id="queryTab">已上传订单</button></div></footer><div id="toast" class="toast hidden" role="status"></div></div><dialog id="viewer"><img id="large" alt="订单截图" style="width:100%;max-height:70vh;object-fit:contain"><button id="closeViewer" class="primary">关闭</button></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selectedOrder=null;let seq=0,drafts=[],records=[],target=null,mergePair=null;const dayString=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);function redeemErrors(){const current=drafts.filter(d=>d.ka===$('ka').value),errors=[],seen=new Set();if(!current.length){errors.push('请先上传并核对订单。')}else{if(current.some(d=>{const no=d.no.trim();const duplicate=no&&(conflict(d.ka,no)||seen.has(no));if(no)seen.add(no);return duplicate}))errors.push('同KA订单号已存在不能提交');if(current.some(d=>!dateValid(d.date)))errors.push('每个订单的下单时间必须在30天内')}return errors}function showRedeemErrors(){const errors=redeemErrors();$('redeemError').textContent=errors.join('\n');return errors}$('generateRedeem').onclick=()=>{if(showRedeemErrors().length){$('redeemError').scrollIntoView({block:'nearest'});return}};function bounds(){const today=dayString(new Date()),low=new Date(today+'T00:00:00+08:00');low.setDate(low.getDate()-29);return {today,min:dayString(low)}}function dateValid(date){const b=bounds();return /^\d{4}-\d{2}-\d{2}$/.test(date)&&date>=b.min&&date<=b.today}function recent(at){const now=new Date(),cut=new Date(now);cut.setMonth(cut.getMonth()-2);return new Date(at)>=cut&&new Date(at)<=now}function conflict(ka,no){return records.some(r=>r.ka===ka&&r.no===no.trim())}function msg(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(window.timer);window.timer=setTimeout(()=>$('toast').classList.add('hidden'),2500)}function blankItem(){return {brand:'品牌1',stage:'1段',gram:'400',qty:'',manual:true}}function make(files){let d={id:++seq,ka:$('ka').value,no:'',date:'',items:[],recognized:false,images:files.map(f=>({id:++seq,name:f.name,url:URL.createObjectURL(f)}))};drafts.push(d);return d}function edit(id,key,val){drafts.find(d=>d.id===id)[key]=val;validate(id);updateActions()}function editItem(id,i,key,val){drafts.find(d=>d.id===id).items[i][key]=val;validate(id)}function validate(id){let d=drafts.find(d=>d.id===id);if(!d||!$('dup'+id))return;const dup=conflict(d.ka,d.no),badDate=d.date&&!dateValid(d.date),same=d.no.trim()&&drafts.some(x=>x.id!==id&&x.ka===d.ka&&x.no.trim()===d.no.trim());$('dup'+id).textContent=dup?'该订单号在当前 KA 已存在，不能提交。':same?'此订单号与另一笔订单重复，请修改或删除重复订单。':'';$('dateError'+id).textContent=badDate?'下单日期须在近 30 天内，且不能晚于今天。':'';$('save'+id).disabled=!!(dup||badDate||same);return !dup&&!badDate&&!same}function itemHTML(d,x,i){const control=(key,options)=>x.manual?'<select onchange="editItem('+d.id+','+i+',\''+key+'\',this.value)">'+options.map(v=>'<option value="'+v+'" '+(String(x[key])===v?'selected':'')+'>'+v+(key==='gram'?'G':'')+'</option>').join('')+'</select>':'<input value="'+esc(x[key])+'" '+(key==='gram'?'inputmode="numeric"':'')+' oninput="editItem('+d.id+','+i+',\''+key+'\',this.value)">';return '<div class="goods"><div class="heading"><b>商品 '+(i+1)+'</b><button class="secondary" onclick="removeItem('+d.id+','+i+')">删除</button></div><label class="field">品牌'+control('brand',['品牌1','品牌2','品牌3'])+'</label><div class="row compact-specs"><label class="field">阶段'+control('stage',['1段','2段','3段','4段'])+'</label><label class="field">克数（g）'+control('gram',['400','800'])+'</label><label class="field">听数<input inputmode="numeric" value="'+esc(x.qty)+'" placeholder="请输入听数" oninput="editItem('+d.id+','+i+',\'qty\',this.value)"></label></div></div>'}function render(){updateActions();const count=uploadCount();$('upload').disabled=count>=3;$('upload').classList.toggle('hidden',count>=3);$('uploadLabel').textContent='＋';$('uploadHint').textContent='每次上传1张，最多3张（'+count+'/3）';if($('redeemError').textContent)showRedeemErrors();const ds=drafts.filter(d=>d.ka===$('ka').value),b=bounds();$('loose').innerHTML=ds.map(d=>d.images.map(img=>'<div class="uploaded-tile"><button class="tile-preview" aria-label="预览订单截图" onclick="preview('+d.id+','+img.id+')"><img src="'+img.url+'" alt="订单截图"></button><button class="tile-remove" aria-label="移除截图及待录入订单" onclick="deleteOrder('+d.id+')">×</button></div>').join('')).join('');$('empty').classList.toggle('hidden',ds.some(d=>d.recognized));$('draftList').innerHTML=ds.filter(d=>d.recognized).map((d,i)=>'<article class="card"><h2>订单 '+(i+1)+'</h2><button class="order-link" onclick="openOrder('+d.id+')">订单号：'+esc(d.no||'待填写')+' <span>›</span></button></article>').join('');$('forms').innerHTML=ds.filter(d=>d.id===selectedOrder).map((d)=>'<article class="card" id="card'+d.id+'"><div class="heading"><h2>订单 '+(ds.indexOf(d)+1)+'</h2><button class="secondary" onclick="deleteOrder('+d.id+')">删除</button></div><div class="shot-grid">'+d.images.map(s=>'<div><button class="thumb" onclick="preview('+d.id+','+s.id+')"><img src="'+s.url+'" alt="订单截图"></button></div>').join('')+'</div><div class="note">识别结果可修改</div><label class="field">订单号<input value="'+esc(d.no)+'" placeholder="请输入订单号" oninput="edit('+d.id+',\'no\',this.value)"></label><div id="dup'+d.id+'" class="error" role="alert"></div><label class="field">下单日期<input type="date" min="'+b.min+'" max="'+b.today+'" value="'+esc(d.date)+'" onchange="edit('+d.id+',\'date\',this.value)"></label><div id="dateError'+d.id+'" class="error" role="alert"></div>'+d.items.map((x,j)=>itemHTML(d,x,j)).join('')+'<button class="secondary" style="width:100%;margin:10px 0" onclick="addItem('+d.id+')">＋ 添加商品</button><div id="error'+d.id+'" class="error" role="alert"></div><button id="save'+d.id+'" class="primary" onclick="submit('+d.id+')">保存</button></article>').join('');ds.forEach(d=>validate(d.id));let rs=records.filter(r=>r.ka===$('ka').value&&recent(r.at)&&r.no.includes($('search').value.trim())).sort((a,b)=>b.at.localeCompare(a.at));$('list').innerHTML=rs.map(r=>'<article class="card"><div class="number">'+esc(r.no)+'</div><div class="record-row"><span>下单时间</span><b>'+esc(r.date)+'</b></div><div class="record-row"><span>订单详情</span><b>'+r.items.map(x=>esc(x.brand)+' '+esc(x.stage)+' '+esc(x.qty)+'听').join('、')+'</b></div><div class="record-row"><span>上传时间</span><b>'+esc(new Date(r.at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}))+'</b></div></article>').join('')||'<div class="empty">暂无匹配的订单</div>'}function updateActions(){const current=drafts.filter(d=>d.ka===$('ka').value);$('generateRedeem').disabled=!current.some(d=>d.no.trim());$('recognize').disabled=!current.some(d=>!d.recognized)}$('recognize').onclick=()=>{const pending=drafts.filter(d=>d.ka===$('ka').value&&!d.recognized);if(!pending.length)return;pending.forEach(d=>{d.no=bounds().today.replaceAll('-','')+String(d.id).padStart(10,'0');d.date=bounds().today;d.items=[{brand:'品牌1',stage:'2段',gram:'800',qty:'3'}];d.recognized=true});render();msg('识别完成，请核对订单信息')};function uploadCount(){return drafts.filter(d=>d.ka===$('ka').value).reduce((n,d)=>n+d.images.length,0)}function pick(){if(uploadCount()>=3)return msg('最多上传3张截图');$('files').click()}$('upload').onclick=pick;$('files').onchange=()=>{const files=[...$('files').files];$('files').value='';if(!files.length)return;if(files.length!==1)return msg('每次只能上传1张截图');if(uploadCount()>=3)return msg('最多上传3张截图');if(!/^image\//.test(files[0].type))return msg('请选择图片文件');make([files[0]]);render();msg('已添加截图，请点击上传并开始识别')};function preview(id,sid){$('large').src=drafts.find(d=>d.id===id).images.find(s=>s.id===sid).url;$('viewer').showModal()}$('closeViewer').onclick=()=>$('viewer').close();function deleteOrder(id){let d=drafts.find(x=>x.id===id);d.images.forEach(s=>URL.revokeObjectURL(s.url));drafts=drafts.filter(x=>x.id!==id);if(selectedOrder===id)page(false);else render()}function addItem(id){drafts.find(d=>d.id===id).items.push(blankItem());render()}function removeItem(id,i){let d=drafts.find(x=>x.id===id);if(d.items.length===1)return msg('至少保留一条商品信息');d.items.splice(i,1);render()}function submit(id){let d=drafts.find(x=>x.id===id);if(!validate(id))return;const error=!d.images.length?'请上传订单截图。':!d.no.trim()?'请填写订单号。':!dateValid(d.date)?'请选择近 30 天内的下单日期。':d.items.some(x=>!x.brand.trim()||!x.stage.trim()||!/^\d+$/.test(x.gram)||+x.gram<1||!/^\d+$/.test(String(x.qty))||+x.qty<1)?'请补全商品信息，克数和听数须为正整数。':'';if(error){$('error'+id).textContent=error;return}records.push({ka:d.ka,no:d.no.trim(),date:d.date,items:d.items.map(x=>({...x})),at:new Date().toISOString()});deleteOrder(id);msg('录入成功，可继续上传下一笔订单')}function showBack(type){$('backBar').classList.toggle('hidden',!type);$('backGift').classList.toggle('hidden',type!=='gift');$('backList').classList.toggle('hidden',type!=='list')}function openOrder(id){showBack('list');selectedOrder=id;$('entry').classList.add('hidden');$('query').classList.add('hidden');$('orderDetail').classList.remove('hidden');$('title').textContent='订单详情';$('scroll').scrollTop=0;render()}$('backList').onclick=()=>page(false);function page(q){showBack(q?null:'gift');selectedOrder=null;$('orderDetail').classList.add('hidden');$('giftStep').classList.add('hidden');$('orderFooter').classList.remove('hidden');$('entry').classList.toggle('hidden',q);$('query').classList.toggle('hidden',!q);$('title').textContent=q?'已上传订单':'订单录入';$('entryTab').classList.toggle('active',!q);$('queryTab').classList.toggle('active',q);$('scroll').scrollTop=0;render()}$('nextStep').onclick=()=>page(false);$('backGift').onclick=()=>{showBack(null);$('entry').classList.add('hidden');$('query').classList.add('hidden');$('giftStep').classList.remove('hidden');$('orderFooter').classList.add('hidden');$('title').textContent='选择赠品';$('scroll').scrollTop=0};$('entryTab').onclick=()=>page(false);$('queryTab').onclick=()=>page(true);$('ka').onchange=()=>{if(!$('orderDetail').classList.contains('hidden'))page(false);else render()};$('search').oninput=render;records.push({ka:'爱婴室',no:'202611020001',date:bounds().today,items:[{brand:'港版皇家',stage:'2段',gram:'800',qty:'3'},{brand:'港版有机皇家',stage:'3段',gram:'800',qty:'2'}],at:new Date().toISOString()});render();
