}function pick(){$('files').click()}$('upload').onclick=pick;$('files').onchange=()=>{const files=[...$('files').files];$('files').value='';if(!files.length)return;if(files.length!==1)return msg('每次只能上传1张截图');if(!/^image\//.test(files[0].type))return msg('请选择图片文件');make([files[0]]);render();msg('已添加截图，请点击上传并开始识别')};function preview(id,sid){$('large').src=drafts.find(d=>d.id===id).images.find(s=>s.id===sid).url;$('viewer').showModal()}$('closeViewer').onclick=()=>$('viewer').close();function deleteOrder(id){let d=drafts.find(x=>x.id===id);d.images.forEach(s=>URL.revokeObjectURL(s.url));drafts=drafts.filter(x=>x.id!==id);if(selectedOrder===id)page(false);else render()}function addItem(id){drafts.find(d=>d.id===id).items.push(blankItem());render()}function removeItem(id,i){let d=drafts.find(x=>x.id===id);if(d.items.length===1)return msg('至少保留一条商品信息');d.items.splice(i,1);render()}function submit(id){let d=drafts.find(x=>x.id===id);if(!validate(id))return;const error=!d.images.length?'请上传订单截图。':!d.no.trim()?'请填写订单号。':!dateValid(d.date)?'请选择近 30 天内的下单日期。':d.items.some(x=>!x.brand.trim()||!x.stage.trim()||!/^\d+$/.test(x.gram)||+x.gram<1||!/^\d+$/.test(String(x.qty))||+x.qty<1)?'请补全商品信息，克数和听数须为正整数。':'';if(error){$('error'+id).textContent=error;return}msg('已保存');page(false)}function showBack(type){$('giftHome').classList.toggle('hidden',type!=='giftHome');$('backBar').classList.toggle('hidden',!type);$('backGift').classList.toggle('hidden',type!=='gift');$('backList').classList.toggle('hidden',type!=='list');$('backHome').classList.toggle('hidden',type!=='home')}function screen(id,title,back){['phoneStep','giftStep','entry','query','orderDetail'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('title').textContent=title;$('scroll').classList.toggle('gift-scroll',id==='giftStep');showBack(back);$('scroll').scrollTop=0}function openOrder(id){selectedOrder=id;screen('orderDetail','订单详情','list');render()}function page(q){selectedOrder=null;screen(q?'query':'entry',q?'上传订单查询':'订单录入',q?'home':'gift');render()}function syncGiftInputs(){const counts=[...document.querySelectorAll(".brand-option input")].map(input=>Number(input.value));document.querySelectorAll(".gift-options").forEach(group=>{const enabled=counts[Number(group.dataset.brand)]>0;group.querySelectorAll(".gift-quantity input").forEach(input=>{input.disabled=!enabled;if(!enabled)input.value=""})})}function giftReady(){const input=document.querySelector('.brand-option.brand-active input');return !!input&&Number(input.value)>0}function gifts(){screen('giftStep','选择赠品','giftHome');syncGiftInputs();$('nextStep').disabled=!giftReady()}$('backList').onclick=()=>page(false);$('backGift').onclick=gifts;$('backHome').onclick=()=>screen('phoneStep','手机号验证',null);$('giftHome').onclick=$('backHome').onclick;$('verifyMobile').onclick=()=>{$('mobileError').textContent='';gifts()};$('historyLink').onclick=()=>page(true);$('aiOrders').onclick=()=>page(false);$('nextStep').onclick=()=>{if(!giftReady())return;const invalid=document.querySelector('.gift-quantity input:invalid');if(invalid){invalid.reportValidity();return}showQrPage()};function showQrPage(){const selected=[...document.querySelectorAll('.gift-product')].filter(card=>!card.querySelector('input').disabled).map(card=>({image:card.querySelector('img'),qty:Number(card.querySelector('input').value),brand:giftBrandNames[Number(card.closest('.gift-options').dataset.brand)]})).filter(x=>x.qty>0);if(!selected.length){msg('请至少输入一件赠品数量');return}$('chosenGifts').replaceChildren();selected.forEach(x=>{const card=document.createElement('div');card.className='chosen-gift';const img=x.image.cloneNode();const qty=document.createElement('div');qty.textContent='数量：'+x.qty;const brand=document.createElement('small');brand.className='qr-gift-brand';brand.textContent=x.brand;card.append(img,brand,qty);$('chosenGifts').append(card)});$('swipeHint').classList.toggle('hidden',selected.length<3);$('qrExpiry').textContent='兑换二维码有效期截止 '+bounds().today+' 23:59
